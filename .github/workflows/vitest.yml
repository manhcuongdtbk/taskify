name: Vitest

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-mise
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint:workflows
      - run: pnpm test:run
      - run: pnpm test:coverage
